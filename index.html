<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Doc-Maker.site | SaaS Генератор</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-slate-900 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">DOC-MAKER.SITE</h1>
            <div id="user-menu" class="hidden flex items-center gap-4">
                <span id="user-email" class="text-sm"></span>
                <button id="logout-btn" class="bg-red-600 px-3 py-1 rounded text-sm hover:bg-red-700">Выйти</button>
            </div>
        </div>
    </header>

    <div class="container mx-auto mt-4 px-2"><div class="bg-gray-200 p-2 text-center text-xs text-gray-500 border border-dashed border-gray-400">Рекламный блок</div></div>

    <main class="container mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <section id="auth-section" class="lg:col-span-12 max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold mb-4">Добро пожаловать в Doc-Maker!</h2>
            <div class="prose text-sm mb-6 text-gray-600">
                <p>Мы создаем счета и АВР для бизнеса в СНГ (РК, РФ, РБ, КР). <strong>Преимущества регистрации:</strong> сохранение истории документов, быстрый доступ к реквизитам и автозаполнение.</p>
            </div>
            <div class="space-y-3">
                <input type="email" id="email" placeholder="Email" class="w-full p-2 border rounded">
                <input type="password" id="pass" placeholder="Пароль" class="w-full p-2 border rounded">
                <div class="flex gap-2">
                    <button id="login-btn" class="flex-1 bg-blue-600 text-white py-2 rounded font-bold">Войти / Регистрация</button>
                    <button id="guest-btn" class="flex-1 bg-gray-600 text-white py-2 rounded font-bold">Вход как Гость</button>
                </div>
            </div>
        </section>

        <section id="app-section" class="hidden lg:col-span-12 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 space-y-4">
                <div class="bg-white p-4 rounded shadow">
                    <div id="type-btns" class="flex gap-2 mb-4">
                        <button data-type="Счет" class="type-btn flex-1 py-2 bg-blue-600 text-white rounded font-bold">Счет</button>
                        <button data-type="АВР" class="type-btn flex-1 py-2 bg-gray-200 rounded font-bold">АВР</button>
                    </div>
                    <div id="country-btns" class="flex gap-1 mb-2"></div>
                    <div id="dynamic-form" class="space-y-2 mt-4"></div>
                </div>
            </div>
            <div class="lg:col-span-8">
                <div id="doc-preview" class="bg-white p-10 shadow border min-h-[500px]"></div>
                <div class="mt-4 flex gap-2 no-print">
                    <button id="btn-pdf" class="bg-red-600 text-white px-6 py-2 rounded font-bold">Скачать PDF</button>
                    <button id="btn-xlsx" class="bg-green-600 text-white px-6 py-2 rounded font-bold">Скачать Excel</button>
                </div>
            </div>
        </section>
    </main>
    <script src="supabase.js"></script>
    <script src="app.js"></script>
</body>
</html>
