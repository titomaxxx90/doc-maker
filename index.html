<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Doc-Maker.site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-slate-900 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">DOC-MAKER.SITE</h1>
        <button id="logout-btn" class="hidden bg-red-600 px-4 py-1 rounded">Выйти</button>
    </header>

    <div class="container mx-auto mt-2 text-center text-xs text-gray-500 border-dashed border p-2 bg-white">Место для рекламы</div>

    <main class="container mx-auto p-4 grid grid-cols-12 gap-6">
        <div id="auth-box" class="col-span-12 max-w-lg mx-auto bg-white p-6 rounded shadow">
            <h2 class="text-xl font-bold mb-4">Вход в систему</h2>
            <p class="text-sm mb-4">Регистрация позволяет сохранять историю ваших документов.</p>
            <div class="space-y-2">
                <input id="email" type="email" placeholder="Email" class="w-full border p-2 rounded">
                <input id="pass" type="password" placeholder="Пароль" class="w-full border p-2 rounded">
                <button id="login-btn" class="w-full bg-blue-600 text-white py-2 rounded">Войти</button>
                <button id="guest-btn" class="w-full bg-gray-600 text-white py-2 rounded">Вход как Гость</button>
            </div>
        </div>

        <div id="app-box" class="hidden col-span-12 lg:col-span-4 bg-white p-4 rounded shadow space-y-4">
            <div class="flex gap-2">
                <button onclick="setDoc('Счет')" class="flex-1 bg-blue-600 text-white py-2 rounded">Счет</button>
                <button onclick="setDoc('АВР')" class="flex-1 bg-blue-600 text-white py-2 rounded">АВР</button>
            </div>
            <div id="country-btns" class="flex gap-1"></div>
            <div id="form-fields" class="space-y-2"></div>
            <div class="flex gap-2">
                <button onclick="downloadPDF()" class="flex-1 bg-red-600 text-white py-2 rounded">PDF</button>
                <button onclick="downloadExcel()" class="flex-1 bg-green-600 text-white py-2 rounded">Excel</button>
            </div>
        </div>

        <div id="preview-box" class="hidden col-span-12 lg:col-span-8 bg-white p-8 shadow min-h-[600px]" id="doc-render">
            </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
