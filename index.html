<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc-Maker | Создание счетов и АВР</title>
    <meta name="description" content="SaaS сервис для генерации счетов на оплату и АВР. Поддержка стран: РК, РФ, РБ, КР.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider">Doc-Maker.site</h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-email" class="text-sm"></span>
                <button id="logout-btn" class="bg-blue-800 hover:bg-blue-900 px-3 py-1 rounded text-sm transition">Выйти</button>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8">
        
        <div id="auth-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg mt-10">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-700">Вход в систему</h2>
            <input type="email" id="email-input" placeholder="Ваш Email" class="w-full mb-4 px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="password-input" placeholder="Ваш Пароль" class="w-full mb-6 px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition mb-2">Войти</button>
            <button id="register-btn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded transition">Создать аккаунт</button>
            <p id="auth-message" class="mt-4 text-center text-sm font-semibold hidden"></p>
        </div>

        <div id="app-section" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <div id="form-container" class="bg-white p-6 rounded-xl shadow-lg">
                    <h3 class="text-xl font-bold mb-4 border-b pb-2">Данные для документа</h3>
                    <div id="dynamic-form-area"></div>
                </div>

                <div id="preview-container" class="bg-white p-6 rounded-xl shadow-lg flex flex-col">
                    <h3 class="text-xl font-bold mb-4 border-b pb-2">Предпросмотр документа</h3>
                    
                    <div id="document-preview" class="flex-grow border-2 border-dashed border-gray-300 p-8 rounded bg-white overflow-auto text-sm text-black">
                        </div>
                    
                    <div class="mt-6 flex flex-wrap gap-2">
                        <button id="export-pdf-btn" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 px-2 rounded transition font-semibold shadow">Скачать PDF</button>
                        <button id="export-excel-btn" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 px-2 rounded transition font-semibold shadow">Скачать Excel</button>
                        <button id="save-db-btn" class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white py-2 px-2 rounded transition font-semibold shadow">В историю</button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white text-center py-4 mt-auto">
        <p>&copy; 2026 Doc-Maker.site. Все права защищены.</p>
    </footer>

    <script src="supabase.js"></script>
    <script src="app.js"></script>
</body>
</html>
