<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc-Maker.site | Счета и АВР</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        @media print { .no-print { display: none; } }
        .ads-box { background: #f9f9f9; border: 1px dashed #ccc; text-align: center; color: #999; padding: 10px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <div class="ads-box w-full no-print">Место для рекламы (Google/Yandex) - Top Banner</div>

    <header class="bg-slate-800 text-white p-4 shadow-lg no-print">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tighter">DOC-MAKER<span class="text-blue-400">.SITE</span></h1>
            <div id="user-info" class="hidden flex items-center gap-4 text-sm">
                <span id="user-email" class="opacity-70"></span>
                <button id="logout-btn" class="bg-red-500/20 hover:bg-red-500 px-3 py-1 rounded transition">Выйти</button>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 max-w-6xl">
        <div id="auth-section" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-10">
            <h2 class="text-2xl font-bold mb-6 text-center">Вход в SaaS</h2>
            <input type="email" id="email-input" placeholder="Email" class="w-full mb-3 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="password-input" placeholder="Пароль" class="w-full mb-3 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            <button id="login-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl mb-2 hover:bg-blue-700 transition">Войти</button>
            <button id="register-btn" class="w-full text-gray-500 text-sm hover:underline">Нет аккаунта? Регистрация</button>
            <p id="auth-message" class="mt-4 text-center text-xs hidden"></p>
        </div>

        <div id="app-section" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 mt-4">
            <div class="lg:col-span-4 space-y-4 no-print">
                <div class="bg-white p-5 rounded-2xl shadow-sm border">
                    <h3 class="font-bold mb-3 text-gray-700">1. Тип документа и Страна</h3>
                    <div class="flex gap-2 mb-4">
                        <button onclick="setDocType('Счет')" id="btn-type-inv" class="flex-1 py-2 rounded-lg bg-blue-600 text-white text-sm font-bold">СЧЕТ</button>
                        <button onclick="setDocType('АВР')" id="btn-type-avr" class="flex-1 py-2 rounded-lg bg-gray-100 text-gray-600 text-sm font-bold">АВР</button>
                    </div>
                    <div id="country-btns" class="grid grid-cols-4 gap-1"></div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border">
                    <h3 class="font-bold mb-3 text-gray-700">2. Поставщик (Вы)</h3>
                    <input type="text" id="p-name" placeholder="Ваша компания / ИП" class="w-full p-2 mb-2 border rounded-lg text-sm" oninput="updatePreview()">
                    <input type="text" id="p-tax" placeholder="Ваш ИНН/БИН" class="w-full p-2 border rounded-lg text-sm" oninput="updatePreview()">
                </div>

                <div id="dynamic-form" class="bg-white p-5 rounded-2xl shadow-sm border">
                    <h3 class="font-bold mb-3 text-gray-700">3. Данные клиента</h3>
                    </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border">
                    <h3 class="font-bold mb-3 text-gray-700">4. История</h3>
                    <div id="history-list" class="text-xs space-y-2 max-h-40 overflow-y-auto">
                        Загрузка истории...
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 flex flex-col">
                <div class="bg-white p-2 rounded-t-2xl border-x border-t flex gap-2 no-print">
                    <button onclick="downloadPDF()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold flex-1">PDF + Автосохранение</button>
                    <button onclick="downloadExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex-1">Excel + Автосохранение</button>
                </div>
                <div id="document-preview" class="bg-white border p-10 shadow-sm min-h-[842px] overflow-x-auto rounded-b-2xl">
                    </div>
            </div>
        </div>
    </main>

    <div class="ads-box w-full mt-auto no-print">Место для рекламы - Bottom Footer Banner</div>

    <script src="supabase.js"></script>
    <script src="app.js"></script>
</body>
</html>
