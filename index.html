<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc-Maker.site | Генератор документов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .doc-paper { font-family: "Times New Roman", serif; color: black; line-height: 1.2; }
        .border-black { border: 1px solid black; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white p-4 no-print shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tighter cursor-pointer" onclick="location.reload()">DOC-MAKER<span class="text-blue-400">.SITE</span></h1>
            <button id="logout-btn" class="hidden bg-red-600 px-4 py-1 rounded text-sm transition hover:bg-red-700">Выйти</button>
        </div>
    </header>

    <div class="container mx-auto px-4 py-4 no-print">
        <div class="bg-gray-200 h-[90px] flex items-center justify-center text-gray-500 text-xs">
            [Место для Google AdSense]
        </div>
    </div>

    <main class="container mx-auto p-4 flex-grow">
        <section id="auth-section" class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl mt-6 overflow-hidden grid grid-cols-1 md:grid-cols-2">
            <div class="p-8 bg-slate-50 border-r">
                <h2 class="text-2xl font-bold mb-6 text-slate-800">О сервисе Doc-Maker.site</h2>
                <div class="space-y-4 text-sm text-gray-600 leading-relaxed">
                    <p>Простой инструмент для создания счетов и актов выполненных работ онлайн. Работайте с Казахстаном, Россией, Беларусью и Кыргызстаном.</p>
                </div>
            </div>
            <div class="p-8 space-y-4 flex flex-col justify-center">
                <input type="email" id="email-input" placeholder="Email" class="w-full p-3 border rounded-xl">
                <input type="password" id="password-input" placeholder="Пароль" class="w-full p-3 border rounded-xl">
                <div class="grid grid-cols-2 gap-2">
                    <button id="login-btn" class="bg-blue-600 text-white font-bold py-3 rounded-xl">Войти</button>
                    <button id="reg-btn" class="bg-emerald-600 text-white font-bold py-3 rounded-xl">Регистрация</button>
                </div>
                <button id="guest-btn" class="w-full bg-slate-200 py-3 rounded-xl">Войти как Гость</button>
            </div>
        </section>

        <section id="app-section" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 space-y-4 no-print">
                <div class="bg-white p-4 rounded-xl shadow border">
                    <div class="flex gap-2 mb-4">
                        <button onclick="setDocType('Счет')" id="btn-inv" class="flex-1 py-2 rounded-lg bg-blue-600 text-white font-bold text-xs">СЧЕТ</button>
                        <button onclick="setDocType('АВР')" id="btn-avr" class="flex-1 py-2 rounded-lg bg-gray-100 text-gray-500 font-bold text-xs">АВР</button>
                    </div>
                    <div id="country-btns" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border space-y-2">
                    <input type="text" id="doc-number" placeholder="№ док-та" class="w-full p-2 border rounded text-xs" oninput="updatePreview()">
                    <input type="date" id="doc-date" class="w-full p-2 border rounded text-xs" oninput="updatePreview()">
                </div>
                <div class="bg-white p-4 rounded-xl shadow border space-y-2">
                    <input type="text" id="p-name" placeholder="Название вашей компании" class="w-full p-2 border rounded text-xs" oninput="updatePreview()">
                    <input type="text" id="p-tax" placeholder="Ваш БИН/ИНН" class="w-full p-2 border rounded text-xs" oninput="updatePreview()">
                    <input type="text" id="p-bank" placeholder="Реквизиты банка" class="w-full p-2 border rounded text-xs" oninput="updatePreview()">
                    <div id="staff-fields" class="space-y-2"></div>
                </div>
                <div id="dynamic-form" class="bg-white p-4 rounded-xl shadow border space-y-2"></div>
                <div id="history-box" class="bg-white rounded-xl shadow border hidden overflow-hidden max-h-[300px]">
                    <div class="flex bg-gray-100 border-b">
                        <button onclick="switchHistoryTab('Счет')" id="tab-h-inv" class="flex-1 py-2 text-[10px] font-bold bg-white text-blue-600 border-r">СЧЕТА</button>
                        <button onclick="switchHistoryTab('АВР')" id="tab-h-avr" class="flex-1 py-2 text-[10px] font-bold text-gray-400">АКТЫ</button>
                    </div>
                    <div id="history-list" class="p-2 space-y-2 overflow-y-auto custom-scrollbar"></div>
                </div>
            </div>
            <div class="lg:col-span-8 space-y-4">
                <button onclick="downloadPDF()" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 transition">СКАЧАТЬ В PDF</button>
                <div id="doc-render-area" class="bg-white p-12 shadow-2xl min-h-[1000px] border border-gray-300 doc-paper"></div>
            </div>
        </section>
    </main>
</body>
</html>
