<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Doc-Maker.site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-slate-800 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">DOC-MAKER.SITE</h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-email" class="text-sm"></span>
                <button id="logout-btn" class="bg-red-600 px-3 py-1 rounded text-sm">Выйти</button>
            </div>
        </div>
    </header>

    <div class="container mx-auto mt-2">
        <div class="bg-white border border-dashed border-gray-400 p-2 text-center text-gray-500 text-xs">Место для рекламы</div>
    </div>

    <main class="flex-grow container mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div id="auth-section" class="lg:col-span-12 max-w-md mx-auto bg-white p-8 rounded shadow">
            <h2 class="text-xl font-bold mb-4">Вход в систему</h2>
            <input type="email" id="email-input" class="w-full mb-2 p-2 border rounded" placeholder="Email">
            <input type="password" id="password-input" class="w-full mb-4 p-2 border rounded" placeholder="Пароль">
            <button id="login-btn" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Войти</button>
        </div>

        <div id="app-section" class="hidden lg:col-span-12 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 space-y-4">
                <div class="bg-white p-4 rounded shadow">
                    <div id="type-btns" class="flex gap-2 mb-4">
                        <button data-type="Счет" class="type-btn flex-1 py-2 bg-blue-600 text-white rounded font-bold">Счет</button>
                        <button data-type="АВР" class="type-btn flex-1 py-2 bg-gray-200 rounded font-bold">АВР</button>
                    </div>
                    <div id="country-btns" class="flex gap-1 mb-4"></div>
                    <div id="dynamic-form" class="space-y-2"></div>
                </div>
            </div>
            <div class="lg:col-span-8">
                <div id="document-preview" class="bg-white p-10 shadow min-h-[500px] border"></div>
                <div class="mt-4 flex gap-2">
                    <button id="btn-pdf" class="bg-red-600 text-white px-6 py-2 rounded font-bold">Скачать PDF</button>
                    <button id="btn-excel" class="bg-green-600 text-white px-6 py-2 rounded font-bold">Скачать Excel</button>
                </div>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script src="app.js"></script>
</body>
</html>
